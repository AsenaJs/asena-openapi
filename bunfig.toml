[test]

coverage = true

coverageSkipTestFiles = true

coveragePathIgnorePatterns = ["test/utils/*.ts", "dist/**/*.js", "dist/**/*.ts", "../**/*.ts", "../**/*.js"]


[test.reporter]
junit = "junit.xml"

[fmt]
printWidth = 120
singleQuote = true
tabWidth = 2
useTabs = false
endOfLine = "lf"
semi = true
trailingComma = "all"
arrowParens = "always"
bracketSpacing = true
bracketSameLine = false
quoteProps = "as-needed"
jsxSingleQuote = false
proseWrap = "preserve"
htmlWhitespaceSensitivity = "css"
embeddedLanguageFormatting = "auto"
vueIndentScriptAndStyle = false
objectWrap = "preserve"
experimentalTernaries = false
experimentalOperatorPosition = "end"
singleAttributePerLine = false
requirePragma = false
insertPragma = false
